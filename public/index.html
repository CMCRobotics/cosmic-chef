<!DOCTYPE html>
<html>
<head>
    <title>Cosmic Chef</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Vendor Dependencies Bundle (Offline / Local) -->
    <script src="vendor/bundle.js"></script>

    <script src="xstate/preparation-machine.js"></script>
    <script src="aframe-components/animations/anim-linear.js"></script>
    <script src="aframe-components/animations/anim-tenderizing.js"></script>
    <script src="aframe-components/animations/anim-stirring.js"></script>
    <script src="aframe-components/animations/anim-slicing.js"></script>
    <script src="aframe-components/load-fragment.js"></script>
    <script src="aframe-components/ar-utils.js"></script>
    <script src="aframe-components/preparation-manager.js"></script>
    <script src="aframe-components/galley-manager.js"></script>
    <script src="aframe-components/quantum-particle.js"></script>
    <script src="aframe-components/animations/anim-space-float.js"></script>
    <script src="aframe-components/animations/anim-vacuum.js"></script>

</head>
<body>
    <script>
         window.AFRAME_INSPECTOR_CONFIG = {saveEndpoint: "/save"};
    </script>

    <a-scene
        start-experience
        preparation-manager
        webxr="optionalFeatures: hit-test, local-floor, hand-tracking; requiredFeatures: local-floor;"
        renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
        inspector="url: /aframe-inspector.min.js">
      
        <a-assets>
            <a-asset-item id="asset_button_floor_square" src="assets/models/factory/button-floor-square.glb"></a-asset-item>
            <a-asset-item id="asset_conveyor_stripe" src="assets/models/factory/conveyor-stripe.glb"></a-asset-item>
            <a-asset-item id="asset_conveyor_corner" src="assets/models/factory/conveyor-corner.glb"></a-asset-item>
            <a-asset-item id="asset_conveyor_stripe_corner" src="assets/models/factory/conveyor-stripe-corner.glb"></a-asset-item>
            <a-asset-item id="asset_conveyor_stripe_junction_t" src="assets/models/factory/conveyor-stripe-junction-t.glb"></a-asset-item>
            <a-asset-item id="asset_conveyor_stripe_part_end" src="assets/models/factory/conveyor-stripe-part-end.glb"></a-asset-item>
            <a-asset-item id="asset_conveyor_stripe_part_middle" src="assets/models/factory/conveyor-stripe-part-middle.glb"></a-asset-item>
            <a-asset-item id="asset_conveyor_stripe_sides" src="assets/models/factory/conveyor-stripe-sides.glb"></a-asset-item>
            <a-asset-item id="asset_conveyor_stripe_sides_cross" src="assets/models/factory/conveyor-stripe-sides-cross.glb"></a-asset-item>

            <a-asset-item id="asset_hopper_high_round" src="assets/models/factory/hopper-high-round.glb"></a-asset-item>

            <a-asset-item id="asset_machine_connection_pipe" src="assets/models/factory/machine-connection-pipe.glb"></a-asset-item>
            <a-asset-item id="asset_machine_fortified" src="assets/models/factory/machine-fortified.glb"></a-asset-item>
            <a-asset-item id="asset_piston_round" src="assets/models/factory/piston-round.glb"></a-asset-item>

            <a-asset-item id="asset_scanner_high" src="assets/models/factory/scanner-high.glb"></a-asset-item>
            <a-asset-item id="asset_screen_hanging_wide" src="assets/models/factory/screen-hanging-wide.glb"></a-asset-item>



            <a-asset-item id="asset_cooking_knife" src="assets/models/food/cooking-knife.glb"></a-asset-item>
            <a-asset-item id="asset_cooking_spatula" src="assets/models/food/cooking-spatula.glb"></a-asset-item>
            <a-asset-item id="asset_cooking_spoon" src="assets/models/food/cooking-spoon.glb"></a-asset-item>
            <a-asset-item id="asset_utensil_spoon" src="assets/models/food/utensil-spoon.glb"></a-asset-item>
            <a-asset-item id="asset_meat_tenderizer" src="assets/models/food/meat-tenderizer.glb"></a-asset-item>
            <a-asset-item id="asset_cutting_board" src="assets/models/food/cutting-board.glb"></a-asset-item>
            <a-asset-item id="asset_frying_pan" src="assets/models/food/frying-pan.glb"></a-asset-item>


        </a-assets>

        <!-- Main world container -->
        <a-entity id="world-root" world-root>
            
            <!-- The light position determines how bright the sun is in the Environment component -->
            <a-entity environment="preset: starry; stageSize: 100; lightPosition: 0 -0.01 -0.2; ground: none; groundTexture: none;"></a-entity>
            
            <!-- <a-light id="light-floor" type="directional" target="#floor" color="#ffffff" 
                     intensity="1.2" position="-1 10 -5" castshadow="true" 
                     shadow="mapSize: 2048x2048; bias: -0.001; near: 0.3; far: 50"></a-light>-->

            <a-circle position="0 -30 0" scale="100 100 100" rotation="-90 0 0" color="black"> </a-circle> 
          
            <!-- <a-entity load-fragment="src: /scene.html; templateId: cosmic-chef-scene"></a-entity> -->


            <a-entity id="hemisphere-light" position="0 50 0" light="color: #CEE4F0; groundColor: #553e35; intensity: 2.3; type: hemisphere"></a-entity>


            <a-entity id="galley" position="0 0 0" galley-manager>
               <a-entity geometry="primitive: ring; radiusInner:6 ; radiusOuter: 9" material="color: red" rotation="-90 0 0" position="0 0.03 0"></a-entity>
               <a-entity load-fragment="src: /galley.html; templateId: cosmic-chef-galley-1"></a-entity>
            </a-entity>

            <!-- <a-entity id="galley" position="20 0 30" rotation="0 -120 0">
               <a-entity geometry="primitive: ring; radiusInner:6 ; radiusOuter: 9" material="color: blue" rotation="-90 0 0" position="0 0.03 0"></a-entity>
               <a-entity load-fragment="src: /galley.html; templateId: cosmic-chef-galley-2"></a-entity>
            </a-entity>


            <a-entity id="galley" position="-20 0 30" rotation="0 120 0">
               <a-entity geometry="primitive: ring; radiusInner:6 ; radiusOuter: 9" material="color: #fffff" rotation="-90 0 0" position="0 0.03 0"></a-entity>
               <a-entity load-fragment="src: /galley.html; templateId: cosmic-chef-galley-3"></a-entity>
            </a-entity> -->


        </a-entity>
      
        <!-- Controller Entities -->
        <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
        <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>

        <!-- Camera Rig -->
        <a-entity id="cameraRig" rotation="-10 180 0" position="0 0 -5.5">
            <a-camera position="0 2.5 0"></a-camera>
        </a-entity>
      
    </a-scene>

    <script>
        const log = window.log.getLogger('main');
        log.setLevel('info');

        const scene = document.querySelector('a-scene');

        scene.addEventListener('loaded', () => {
            log.debug('Scene loaded');

            // TEST: Inject a recipe to test ingredient spawning
            setTimeout(() => {
                const prepMgr = scene.components['preparation-manager'];
                if (prepMgr) {
                    log.debug('Injecting test recipe...');
                    prepMgr.sendEvent('CAPTURE_RECIPE', {
                        recipe: {
                            name: 'proton',
                            composition: 'uud',
                            charge: 1,
                            ingredientSequences: {
                                'up-1': [{ gesture: 'tenderize', preparedState: 'Tender Up', behaviorType: 'resumable' }],
                                'up-2': [{ gesture: 'tenderize', preparedState: 'Tender Up', behaviorType: 'resumable' }],
                                'down-1': [{ gesture: 'slice', preparedState: 'Sliced Down', behaviorType: 'resumable' }]
                            },
                            finalStep: { gesture: 'stir', preparedState: null, behaviorType: 'resumable', stepType: 'synchronized' }
                        }
                    });
                }
            }, 500);
        });

        scene.addEventListener('enter-vr', () => {
            if (scene.is('vr-mode')) {
                log.debug('Entered VR mode');
            }
        });

        // XR session management
        scene.addEventListener('sessionstart', () => {
            log.debug('XR session started');
        });

        scene.addEventListener('sessionend', () => {
            log.debug('XR session ended');
        });

        // Console helpers for testing
        window.testGesture = (gesture, progress = 100, chefId = null) => {
            const prepMgr = scene.components['preparation-manager'];
            if (prepMgr && prepMgr.gameActor) {
                const beforeState = prepMgr.gameActor.getSnapshot();

                const event = {
                    gesture,
                    progressAmount: progress
                };
                if (chefId) {
                    event.chefId = chefId;
                    log.info(`Sending GESTURE_TICK: ${gesture} +${progress}% (${chefId})`);
                } else {
                    log.info(`Sending GESTURE_TICK: ${gesture} +${progress}%`);
                }
                prepMgr.sendEvent('GESTURE_TICK', event);

                // Small delay to let state update
                setTimeout(() => {
                    const afterState = prepMgr.gameActor.getSnapshot();
                    if (beforeState.value !== afterState.value) {
                        log.info(`→ State changed to: ${afterState.value}`);
                    } else {
                        log.debug(`State remains: ${afterState.value}`);
                        // Show context for debugging
                        if (afterState.value === 'readyForFinalStir') {
                            log.debug(`  Stir progress: ${afterState.context.stirProgress}/100`);
                            log.debug(`  Final gesture required: ${afterState.context.currentOrder?.finalStep?.gesture}`);
                        } else if (afterState.value === 'preparingIngredients') {
                            const station = afterState.context.stations.find(s => s.ingredientId);
                            if (station) {
                                log.debug(`  Progress at ${station.stationId}: ${station.progress}/100`);
                            }
                        }
                    }
                }, 50);
            }
        };

        window.testRecipe = (recipeName = 'proton') => {
            const prepMgr = scene.components['preparation-manager'];
            if (prepMgr && prepMgr.gameActor) {
                const { RECIPES } = window;
                const recipe = RECIPES.find(r => r.name === recipeName);
                if (recipe) {
                    // Check current state
                    const snapshot = prepMgr.gameActor.getSnapshot();
                    const currentState = snapshot.value;

                    // If in orderSuccess or orderPenalized, go back to waitingForRecipe first
                    if (currentState === 'orderSuccess' || currentState === 'orderPenalized') {
                        log.info(`Transitioning from ${currentState} → waitingForRecipe with NEXT_ROUND`);
                        prepMgr.sendEvent('NEXT_ROUND');
                        // Small delay to let state update
                        setTimeout(() => {
                            log.info(`Sending CAPTURE_RECIPE: ${recipeName}`);
                            prepMgr.sendEvent('CAPTURE_RECIPE', { recipe });
                        }, 50);
                    } else {
                        log.info(`Sending CAPTURE_RECIPE: ${recipeName}`);
                        prepMgr.sendEvent('CAPTURE_RECIPE', { recipe });
                    }
                } else {
                    log.error(`Recipe ${recipeName} not found`);
                }
            }
        };

        window.testSubmit = () => {
            const prepMgr = scene.components['preparation-manager'];
            if (prepMgr && prepMgr.gameActor) {
                const beforeState = prepMgr.gameActor.getSnapshot();

                log.info('Sending SUBMIT_RECIPE');
                prepMgr.sendEvent('SUBMIT_RECIPE');

                // Small delay to let state update
                setTimeout(() => {
                    const afterState = prepMgr.gameActor.getSnapshot();
                    const newState = afterState.value;

                    if (newState === 'orderSuccess') {
                        log.info('✓ Recipe matched! Order successful!');
                        log.info(`Score: ${afterState.context.score}`);
                        log.info('Next: testRecipe(name) to load another, or testState() to check current state');
                    } else if (newState === 'orderPenalized') {
                        log.info('✗ Recipe did not match. Order penalized.');
                        log.info(`Score: ${afterState.context.score}`);
                        log.info('Next: testRecipe(name) to load another, or testState() to check current state');
                    } else {
                        log.info(`State: ${newState}`);
                        log.info('Next: check state or try submitting again');
                    }
                }, 50);
            }
        };

        window.testState = () => {
            const prepMgr = scene.components['preparation-manager'];
            if (prepMgr && prepMgr.gameActor) {
                const snapshot = prepMgr.gameActor.getSnapshot();
                log.info(`Current State: ${snapshot.value}`);
                log.info(`Chefs: ${snapshot.context.activeChefsCount}`);
                log.info(`Ingredients: ${snapshot.context.ingredients.length}`);
                log.info(`Score: ${snapshot.context.score}`);
                return snapshot.value;
            }
        };

        window.setChefs = (count) => {
            const prepMgr = scene.components['preparation-manager'];
            if (prepMgr) {
                console.log(`Setting active chefs to ${count}`);
                prepMgr.sendEvent('SET_ACTIVE_CHEFS', { count });
            }
        };

        window.getDeliveryAreaPosition = () => {
            const galleyEl = document.querySelector('[galley-manager]');
            if (!galleyEl) {
                log.error('galley-manager element not found');
                return undefined;
            }
            const galleyMgr = galleyEl.components['galley-manager'];
            if (!galleyMgr) {
                log.error('galley-manager component not initialized');
                return undefined;
            }
            const pos = galleyMgr.data.deliveryAreaPosition;
            log.info(`Delivery Area Position: x=${pos.x}, y=${pos.y}, z=${pos.z}`);
            return pos;
        };

        window.debug = (enable = true) => {
            const level = enable ? 'debug' : 'info';
            window.log.setLevel(level);
            console.log(`Log level set to: ${level}`);
        };

        log.info('Test helpers available:');
        log.info('  debug(true/false) — toggle debug logging');
        log.info('  testState() — show current state');
        log.info('  testRecipe(name) — load a recipe (pion, proton, neutron, lambda)');
        log.info('  testGesture(gesture, progress, chefId) — trigger gesture (chefId required)');
        log.info('    Examples:');
        log.info('      testGesture("tenderize", 100, "chef-1")   // 100% by chef-1');
        log.info('      testGesture("slice", 50, "chef-2")        // 50% progress by chef-2');
        log.info('      testGesture("stir", 100, "chef-3")        // final stir by chef-3');
        log.info('  testSubmit() — submit the dish');
    </script>
</body>
</html>
