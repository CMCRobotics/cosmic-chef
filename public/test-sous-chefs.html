<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sous-Chef Gesture Test Interface</title>
    <!-- Vendor Dependencies Bundle (includes RxJS, XState, loglevel, etc.) -->
    <script src="vendor/bundle.js"></script>
    <!-- MQTT Client -->
    <script src="https://cdn.jsdelivr.net/npm/mqtt@5.0.0/dist/mqtt.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 30px;
        max-width: 1000px;
        width: 100%;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        text-align: center;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .connection-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 30px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 8px;
      }

      .status-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ccc;
        transition: background 0.3s;
      }

      .status-indicator.connected {
        background: #4caf50;
        box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
      }

      .status-text {
        font-weight: 600;
      }

      .config {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 15px;
        margin-bottom: 30px;
      }

      .config-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .config-group label {
        font-weight: 600;
        color: #333;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .config-group input,
      .config-group select {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }

      .config-group input:focus,
      .config-group select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
      }

      button {
        flex: 1;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .btn-connect {
        background: #667eea;
        color: white;
      }

      .btn-connect:hover:not(:disabled) {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .btn-connect:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .btn-disconnect {
        background: #f44336;
        color: white;
      }

      .btn-disconnect:hover:not(:disabled) {
        background: #d32f2f;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
      }

      .btn-disconnect:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .keyboard-layout {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 30px;
      }

      .sous-chef-panel {
        background: #f9f9f9;
        border: 2px solid #ddd;
        border-radius: 8px;
        padding: 20px;
      }

      .sous-chef-panel.active {
        border-color: #667eea;
        background: #f0f3ff;
      }

      .sous-chef-title {
        font-weight: 700;
        margin-bottom: 15px;
        font-size: 16px;
        color: #333;
      }

      .gesture-buttons {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .gesture-btn {
        padding: 10px;
        background: white;
        border: 2px solid #ddd;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.2s;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .gesture-btn:hover {
        border-color: #667eea;
        background: #f0f3ff;
      }

      .gesture-btn.active {
        background: #667eea;
        color: white;
        border-color: #667eea;
      }

      .key-hint {
        font-size: 11px;
        opacity: 0.7;
        font-family: monospace;
      }

      .head-chef-panel {
        background: #fff3e0;
        border: 2px solid #ff9800;
        border-radius: 8px;
        padding: 20px;
      }

      .head-chef-panel.active {
        border-color: #f57c00;
        background: #ffe0b2;
      }

      .head-chef-title {
        font-weight: 700;
        margin-bottom: 15px;
        font-size: 16px;
        color: #e65100;
      }

      .action-buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 15px;
      }

      .recipe-buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .action-btn {
        padding: 10px;
        background: white;
        border: 2px solid #ff9800;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.2s;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .action-btn:hover {
        background: #ffe0b2;
      }

      .action-btn.active {
        background: #ff9800;
        color: white;
        border-color: #ff9800;
      }

      .recipe-btn {
        padding: 10px;
        background: white;
        border: 2px solid #ff9800;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
        transition: all 0.2s;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 4px;
      }

      .recipe-btn:hover {
        background: #ffe0b2;
      }

      .recipe-btn.active {
        background: #ff9800;
        color: white;
        border-color: #ff9800;
      }

      .recipe-name {
        font-size: 10px;
        opacity: 0.7;
      }

      .recipe-btn.active .recipe-name {
        opacity: 1;
      }

      .log {
        background: #1e1e1e;
        color: #d4d4d4;
        border-radius: 6px;
        padding: 15px;
        font-family: "Courier New", monospace;
        font-size: 12px;
        max-height: 200px;
        overflow-y: auto;
        margin-bottom: 20px;
      }

      .log-entry {
        margin-bottom: 6px;
        display: flex;
        gap: 10px;
      }

      .log-time {
        color: #858585;
        flex-shrink: 0;
      }

      .log-message {
        flex: 1;
      }

      .log-success {
        color: #4ec9b0;
      }

      .log-error {
        color: #f48771;
      }

      .log-info {
        color: #9cdcfe;
      }

      @media (max-width: 768px) {
        .config {
          grid-template-columns: 1fr;
        }

        .keyboard-layout {
          grid-template-columns: 1fr;
        }

        .gesture-buttons {
          grid-template-columns: repeat(3, 1fr);
        }

        .action-buttons {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎮 Sous-Chef Gesture Test Interface</h1>
      <p class="subtitle">Test MQTT sous-chef controller interactions</p>

      <div class="connection-status">
        <div class="status-indicator" id="statusIndicator"></div>
        <span class="status-text">Status: <span id="statusText">Disconnected</span></span>
      </div>

      <div class="config">
        <div class="config-group">
          <label for="brokerUrl">MQTT Broker</label>
          <input
            type="text"
            id="brokerUrl"
            value="ws://localhost:9001"
            placeholder="ws://localhost:9001"
          />
        </div>
        <div class="config-group">
          <label for="teamId">Team ID</label>
          <input
            type="text"
            id="teamId"
            value="team-1"
            placeholder="team-1"
          />
        </div>
        <div class="config-group">
          <label for="gameId">Game ID</label>
          <input
            type="text"
            id="gameId"
            value="default"
            placeholder="default"
          />
        </div>
      </div>

      <div class="controls">
        <button class="btn-connect" id="connectBtn" onclick="connect()">
          Connect
        </button>
        <button
          class="btn-disconnect"
          id="disconnectBtn"
          onclick="disconnect()"
          disabled
        >
          Disconnect
        </button>
      </div>

      <div class="log" id="log"></div>

      <div class="keyboard-layout">
        <!-- Sous-Chef 1 -->
        <div class="sous-chef-panel" id="sousChef1Panel">
          <div class="sous-chef-title">🔪 Sous-Chef 1</div>
          <div class="gesture-buttons">
            <button class="gesture-btn" data-gesture="tenderize" data-sous="1">
              <span>Q - Tenderize</span>
              <span class="key-hint">Q</span>
            </button>
            <button class="gesture-btn" data-gesture="slice" data-sous="1">
              <span>A - Slice</span>
              <span class="key-hint">A</span>
            </button>
            <button class="gesture-btn" data-gesture="stir" data-sous="1">
              <span>Z - Stir</span>
              <span class="key-hint">Z</span>
            </button>
          </div>
        </div>

        <!-- Sous-Chef 2 -->
        <div class="sous-chef-panel" id="sousChef2Panel">
          <div class="sous-chef-title">🔪 Sous-Chef 2</div>
          <div class="gesture-buttons">
            <button class="gesture-btn" data-gesture="tenderize" data-sous="2">
              <span>W - Tenderize</span>
              <span class="key-hint">W</span>
            </button>
            <button class="gesture-btn" data-gesture="slice" data-sous="2">
              <span>S - Slice</span>
              <span class="key-hint">S</span>
            </button>
            <button class="gesture-btn" data-gesture="stir" data-sous="2">
              <span>X - Stir</span>
              <span class="key-hint">X</span>
            </button>
          </div>
        </div>

        <!-- Sous-Chef 3 -->
        <div class="sous-chef-panel" id="sousChef3Panel">
          <div class="sous-chef-title">🔪 Sous-Chef 3</div>
          <div class="gesture-buttons">
            <button class="gesture-btn" data-gesture="tenderize" data-sous="3">
              <span>E - Tenderize</span>
              <span class="key-hint">E</span>
            </button>
            <button class="gesture-btn" data-gesture="slice" data-sous="3">
              <span>D - Slice</span>
              <span class="key-hint">D</span>
            </button>
            <button class="gesture-btn" data-gesture="stir" data-sous="3">
              <span>C - Stir</span>
              <span class="key-hint">C</span>
            </button>
          </div>
        </div>

        <!-- Head Chef -->
        <div class="head-chef-panel" id="headChefPanel">
          <div class="head-chef-title">👨‍🍳 Head Chef</div>
          <div class="action-buttons">
            <button class="action-btn" data-action="cancel">
              <span>T - Cancel</span>
              <span class="key-hint">T</span>
            </button>
            <button class="action-btn" data-action="submit">
              <span>G - Submit</span>
              <span class="key-hint">G</span>
            </button>
          </div>
          <div style="margin-bottom: 15px">
            <div style="font-size: 12px; margin-bottom: 8px; font-weight: 600">
              Capture Recipe
            </div>
            <div class="recipe-buttons">
              <button class="recipe-btn" data-recipe="1">
                <span class="key-hint">1</span>
                <span class="recipe-name">Recipe 1</span>
              </button>
              <button class="recipe-btn" data-recipe="2">
                <span class="key-hint">2</span>
                <span class="recipe-name">Recipe 2</span>
              </button>
              <button class="recipe-btn" data-recipe="3">
                <span class="key-hint">3</span>
                <span class="recipe-name">Recipe 3</span>
              </button>
              <button class="recipe-btn" data-recipe="4">
                <span class="key-hint">4</span>
                <span class="recipe-name">Recipe 4</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/adapters/headChefAdapter.js"></script>
    <script>
      // Recipes (hardcoded for test interface)
      window.RECIPES = [
        {
          name: 'proton',
          composition: 'uud',
          charge: 1,
          ingredientSequences: {
            'up-1': [{ gesture: 'tenderize', preparedState: 'Tender Up', behaviorType: 'resumable' }],
            'up-2': [{ gesture: 'tenderize', preparedState: 'Tender Up', behaviorType: 'resumable' }],
            'down-1': [{ gesture: 'slice', preparedState: 'Sliced Down', behaviorType: 'resumable' }]
          },
          finalStep: { gesture: 'stir', preparedState: null, behaviorType: 'resumable', stepType: 'synchronized' }
        },
        {
          name: 'neutron',
          composition: 'udd',
          charge: 0,
          ingredientSequences: {
            'up-1': [{ gesture: 'slice', preparedState: 'Sliced Up', behaviorType: 'resumable' }],
            'down-1': [{ gesture: 'tenderize', preparedState: 'Tender Down', behaviorType: 'resumable' }],
            'down-2': [{ gesture: 'tenderize', preparedState: 'Tender Down', behaviorType: 'resumable' }]
          },
          finalStep: { gesture: 'stir', preparedState: null, behaviorType: 'resumable', stepType: 'synchronized' }
        }
      ];

      let client = null;
      let connected = false;
      let gameId = null;

      const keyMappings = {
        // Sous-Chef 1
        q: { sous: 1, gesture: "tenderize" },
        a: { sous: 1, gesture: "slice" },
        z: { sous: 1, gesture: "stir" },
        // Sous-Chef 2
        w: { sous: 2, gesture: "tenderize" },
        s: { sous: 2, gesture: "slice" },
        x: { sous: 2, gesture: "stir" },
        // Sous-Chef 3
        e: { sous: 3, gesture: "tenderize" },
        d: { sous: 3, gesture: "slice" },
        c: { sous: 3, gesture: "stir" },
        // Head Chef
        t: { action: "cancel" },
        g: { action: "submit" },
        // Recipes
        "1": { recipe: 1 },
        "2": { recipe: 2 },
        "3": { recipe: 3 },
        "4": { recipe: 4 },
      };

      const activeGestures = new Map();

      function log(message, type = "info") {
        const logEl = document.getElementById("log");
        const entry = document.createElement("div");
        entry.className = `log-entry log-${type}`;
        entry.innerHTML = `
          <span class="log-time">${new Date().toLocaleTimeString()}</span>
          <span class="log-message">${message}</span>
        `;
        logEl.appendChild(entry);
        logEl.scrollTop = logEl.scrollHeight;

        if (logEl.children.length > 50) {
          logEl.removeChild(logEl.children[0]);
        }
      }

      function updateStatus(isConnected) {
        connected = isConnected;
        const indicator = document.getElementById("statusIndicator");
        const text = document.getElementById("statusText");
        const connectBtn = document.getElementById("connectBtn");
        const disconnectBtn = document.getElementById("disconnectBtn");

        if (isConnected) {
          indicator.classList.add("connected");
          text.textContent = `Connected (${gameId || "waiting for game"})`;
          connectBtn.disabled = true;
          disconnectBtn.disabled = false;
          log("✓ Connected to MQTT broker", "success");
        } else {
          indicator.classList.remove("connected");
          text.textContent = "Disconnected";
          connectBtn.disabled = false;
          disconnectBtn.disabled = true;
          log("✗ Disconnected from broker", "error");
        }
      }

      function connect() {
        const brokerUrl = document.getElementById("brokerUrl").value;
        const teamId = document.getElementById("teamId").value;
        let gameIdInput = document.getElementById("gameId").value;

        if (!gameIdInput) {
          gameIdInput = `session-${Date.now()}`;
          document.getElementById("gameId").value = gameIdInput;
        }
        gameId = gameIdInput;

        log(`Connecting to ${brokerUrl}...`, "info");

        try {
          client = mqtt.connect(brokerUrl, {
            clientId: `test-sous-chefs-${Date.now()}`,
            reconnectPeriod: 1000,
          });

          client.on("connect", () => {
            updateStatus(true);
            log(`Team: ${teamId} | Game: ${gameId}`, "success");
            // Initialize adapter subjects for MQTT messaging
            window.headChefAdapterModule?.initializeHeadChefActionSubject();
          });

          client.on("error", (err) => {
            log(`Connection error: ${err.message}`, "error");
          });

          client.on("disconnect", () => {
            updateStatus(false);
          });
        } catch (err) {
          log(`Error: ${err.message}`, "error");
        }
      }

      function disconnect() {
        if (client) {
          client.end();
          updateStatus(false);
        }
      }

      function publishGesture(sous, gesture) {
        if (!connected || !gameId) {
          log("Not connected or game ID missing", "error");
          return;
        }

        const teamId = document.getElementById("teamId").value;
        const topic = `cosmic-chef/team-${teamId}/game-${gameId}/sous-chef-${sous}/gesture/current`;

        client.publish(topic, gesture, { retain: false, qos: 1 }, (err) => {
          if (!err) {
            log(
              `Sous-Chef ${sous}: ${gesture}`,
              "success"
            );
          }
        });
      }

      function publishHeadChefAction(action) {
        if (!connected || !gameId) {
          log("Not connected or game ID missing", "error");
          return;
        }

        const teamId = document.getElementById("teamId").value;

        if (action === "cancel") {
          // Publish to MQTT for external listeners
          const topic = `cosmic-chef/team-${teamId}/game-${gameId}/head-chef/animation/submit-state`;
          client.publish(topic, "idle", { retain: false, qos: 1 });
          // Also publish to local adapter subject for game machine
          window.headChefAdapterModule?.publishHeadChefAction("cancel");
          log("Head Chef: Cancel recipe", "success");
        } else if (action === "submit") {
          // Publish to MQTT for external listeners
          const topic = `cosmic-chef/team-${teamId}/game-${gameId}/head-chef/animation/submit-state`;
          client.publish(topic, "submitting", { retain: false, qos: 1 });
          // Also publish to local adapter subject for game machine
          window.headChefAdapterModule?.publishHeadChefAction("submit");
          log("Head Chef: Submit recipe", "success");
        }
      }

      function captureRecipe(recipeNum) {
        if (!connected || !gameId) {
          log("Not connected or game ID missing", "error");
          return;
        }

        const teamId = document.getElementById("teamId").value;
        const topic = `cosmic-chef/team-${teamId}/game-${gameId}/round/recipe`;

        // Get the recipe object from RECIPES (1-indexed: 1→RECIPES[0], 2→RECIPES[1], etc.)
        if (!window.RECIPES || window.RECIPES.length === 0) {
          log("RECIPES not available", "error");
          return;
        }

        const recipe = window.RECIPES[recipeNum - 1];

        if (!recipe) {
          log(`Recipe ${recipeNum} not found (RECIPES has ${window.RECIPES.length})`, "error");
          return;
        }

        const recipeData = {
          name: recipe.name,
          composition: recipe.composition,
          charge: recipe.charge,
          ingredientSequences: recipe.ingredientSequences,
          finalStep: recipe.finalStep
        };

        client.publish(topic, JSON.stringify(recipeData), {
          retain: false,
          qos: 1,
        });
        log(`Recipe captured: ${recipe.name}`, "success");
      }

      document.addEventListener("keydown", (e) => {
        // Don't intercept if user is typing in input/textarea/contenteditable
        if (e.target.matches("input, textarea, [contenteditable]")) {
          return;
        }

        const key = e.key.toLowerCase();

        if (!keyMappings[key]) return;

        e.preventDefault();

        const mapping = keyMappings[key];

        if (mapping.sous && mapping.gesture) {
          // Only publish if key wasn't already active (prevents repeated keydown events)
          if (!activeGestures.has(key)) {
            publishGesture(mapping.sous, mapping.gesture);
          }
          const btn = document.querySelector(
            `[data-gesture="${mapping.gesture}"][data-sous="${mapping.sous}"]`
          );
          btn?.classList.add("active");
          activeGestures.set(key, btn);
        } else if (mapping.action) {
          publishHeadChefAction(mapping.action);
          const btn = document.querySelector(
            `[data-action="${mapping.action}"]`
          );
          btn?.classList.add("active");
          setTimeout(() => btn?.classList.remove("active"), 200);
        } else if (mapping.recipe) {
          captureRecipe(mapping.recipe);
          const btn = document.querySelector(
            `[data-recipe="${mapping.recipe}"]`
          );
          btn?.classList.add("active");
          setTimeout(() => btn?.classList.remove("active"), 200);
        }
      });

      document.addEventListener("keyup", (e) => {
        const key = e.key.toLowerCase();
        const btn = activeGestures.get(key);
        if (btn) {
          btn.classList.remove("active");
          activeGestures.delete(key);

          if (!connected || !gameId) return;

          const mapping = keyMappings[key];
          if (mapping.sous && mapping.gesture) {
            publishGesture(mapping.sous, "idle");
          }
        }
      });

      // Gesture button clicks
      document.querySelectorAll(".gesture-btn").forEach((btn) => {
        btn.addEventListener("mousedown", () => {
          const gesture = btn.dataset.gesture;
          const sous = btn.dataset.sous;
          publishGesture(sous, gesture);
          btn.classList.add("active");
        });

        btn.addEventListener("mouseup", () => {
          const gesture = btn.dataset.gesture;
          const sous = btn.dataset.sous;
          publishGesture(sous, "idle");
          btn.classList.remove("active");
        });

        btn.addEventListener("mouseleave", () => {
          const gesture = btn.dataset.gesture;
          const sous = btn.dataset.sous;
          publishGesture(sous, "idle");
          btn.classList.remove("active");
        });
      });

      // Action button clicks
      document.querySelectorAll(".action-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const action = btn.dataset.action;
          publishHeadChefAction(action);
          btn.classList.add("active");
          setTimeout(() => btn.classList.remove("active"), 200);
        });
      });

      // Recipe button clicks
      document.querySelectorAll(".recipe-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const recipe = btn.dataset.recipe;
          captureRecipe(parseInt(recipe));
          btn.classList.add("active");
          setTimeout(() => btn.classList.remove("active"), 200);
        });
      });

      // Recipe management
      let currentRecipe = null;

      function initializeRecipeSelector() {
        const recipeSelect = document.getElementById("recipeSelect");
        const { RECIPES } = window;

        if (!recipeSelect) {
          // recipeSelect element not present in UI; recipe buttons are used instead
          return;
        }

        if (RECIPES && RECIPES.length > 0) {
          RECIPES.forEach((recipe, index) => {
            const option = document.createElement("option");
            option.value = index;
            option.textContent = `${recipe.name} (${recipe.composition})`;
            recipeSelect.appendChild(option);
          });
        }
      }

      function captureRecipeFromUI() {
        const recipeSelect = document.getElementById("recipeSelect");

        if (!recipeSelect) {
          log("Recipe selector not available", "error");
          return;
        }

        const recipeIndex = parseInt(recipeSelect.value);

        if (isNaN(recipeIndex)) {
          log("Please select a recipe first", "error");
          return;
        }

        const { RECIPES } = window;
        const recipe = RECIPES[recipeIndex];

        if (!connected || !gameId) {
          log("Not connected or game ID missing", "error");
          return;
        }

        const teamId = document.getElementById("teamId").value;
        const topic = `cosmic-chef/team-${teamId}/game-${gameId}/round/recipe`;
        const recipeData = {
          name: recipe.name,
          composition: recipe.composition,
          charge: recipe.charge,
          ingredientSequences: recipe.ingredientSequences,
          finalStep: recipe.finalStep
        };

        client.publish(topic, JSON.stringify(recipeData), { qos: 1 }, (err) => {
          if (!err) {
            log(`Captured recipe: ${recipe.name}`, "success");
            updateRecipeDisplay(recipe);
            currentRecipe = recipe;
          }
        });
      }

      function updateRecipeDisplay(recipe) {
        const nameEl = document.getElementById("currentRecipeName");
        const compEl = document.getElementById("currentRecipeComposition");

        if (!nameEl || !compEl) {
          // Display elements not present in UI
          return;
        }

        if (recipe) {
          nameEl.textContent = recipe.name;
          compEl.textContent = recipe.composition;
        } else {
          nameEl.textContent = "None";
          compEl.textContent = "-";
        }
      }

      // Subscribe to recipe updates via MQTT
      function subscribeToRecipeUpdates() {
        if (!client) return;

        const teamId = document.getElementById("teamId").value;
        const recipeTopics = [
          `cosmic-chef/team-${teamId}/game-+/round/recipe`
        ];

        recipeTopics.forEach(topic => {
          client.subscribe(topic, (err) => {
            if (!err) {
              log(`Subscribed to recipes: ${topic}`, "info");
            }
          });
        });

        client.on("message", (topic, message) => {
          if (topic.includes("round/recipe")) {
            try {
              const recipe = JSON.parse(message.toString());
              log(`Recipe updated: ${recipe.name}`, "info");
              updateRecipeDisplay(recipe);
              currentRecipe = recipe;
            } catch (err) {
              log(`Failed to parse recipe message: ${err.message}`, "error");
            }
          }
        });
      }

      // Initialize when page loads
      initializeRecipeSelector();

      log("Ready. Configure broker and team settings, then connect.", "info");
    </script>
  </body>
</html>
